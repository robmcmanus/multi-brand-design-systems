name: Build tokens

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --workspace=packages/design-system

      - name: Build tokens
        run: npm run tokens --workspace=packages/design-system

      - name: Check expected CSS files were generated
        working-directory: packages/design-system/build/css
        run: |
          for f in global.css brand-1.css brand-2.css brand-3.css components.css; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          ls -l
